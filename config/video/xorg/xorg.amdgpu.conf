Section "Device"
    Identifier "AMD Card"
    Driver "amdgpu"
    Option "DRI" "3"
    Option "TearFree"  "true"
    Option "SWcursor" "true"     # For virtual mouse cursor
EndSection

Section "Monitor"
    Identifier "Monitor0"
    ModeLine "1920x1080R" 138.50  1920 1968 2000 2080  1080 1083 1088 1111 +hsync -vsync
EndSection

Section "Screen"
    Identifier "Default Screen"
    Monitor "Monitor0"
    Device "AMD Card"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080R"
    EndSubSection
EndSection
